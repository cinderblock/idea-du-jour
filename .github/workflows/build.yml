name: Build image

# Push to master → build the image and push it to GHCR. That is the whole job:
# this repo publishes a *candidate*, it does not deploy.
#
# What runs on firefly is decided in the ops repo (cinderblock/ops) by
# servers/firefly/stacks/idj/pin.json, which names an image digest. Shipping a
# build is two steps: push here, then edit that pin and push ops.
#
# This repo has no self-hosted runner and no access to firefly. It used to run
# its build and its release staging INSIDE the production container. See ops
# plans/ops-owned-app-deploys.md.
on:
  push:
    branches: [master]
  # Pull requests run the same checks and build the image, but publish nothing.
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # cinderblock/idea-du-jour

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - run: bun install --frozen-lockfile

      - name: Build (generates the route tree the typecheck needs)
        # TanStack Router writes src/routeTree.gen.ts during `vite build`. It is
        # gitignored, so on a fresh checkout `tsc` sees every route as `never`
        # and fails on code that is fine. The Docker build below rebuilds from
        # scratch in its own stage; this one exists so the typecheck checks
        # real types.
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Boot the real image and make real requests before anything is published.
      # Pushing master deploys (ops Renovate follows :latest), so this is the
      # last gate. See scripts/smoke.sh for why it exists.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: idj:smoke
          cache-from: type=gha

      - name: Smoke test the image
        run: scripts/smoke.sh idj:smoke ${{ github.sha }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build only on a pull request: nothing is published until it reaches master.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          # ops verifies this label against the commit its pin claims, so a
          # hand-edited pin.json can't quietly ship a different build than the
          # one that was reviewed. Required — the deploy fails without it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize how to deploy this build
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "ops Renovate follows :latest and deploys this to firefly (and the"
            echo "sentinel transcription worker) by itself."
          } >> "$GITHUB_STEP_SUMMARY"
