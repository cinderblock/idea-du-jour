name: Build image

# Push to master → build the image and push it to GHCR. That is the whole job:
# this repo publishes a *candidate*, it does not deploy.
#
# What runs on firefly is decided in the ops repo (cinderblock/ops) by
# servers/firefly/stacks/idj/pin.json, which names an image digest. Shipping a
# build is two steps: push here, then edit that pin and push ops.
#
# This repo has no self-hosted runner and no access to firefly. It used to run
# its build and its release staging INSIDE the production container. See ops
# plans/ops-owned-app-deploys.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # cinderblock/idea-du-jour

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          # ops verifies this label against the commit its pin claims, so a
          # hand-edited pin.json can't quietly ship a different build than the
          # one that was reviewed. Required — the deploy fails without it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize how to deploy this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "Paste that into \`servers/firefly/stacks/idj/pin.json\`"
            echo "in cinderblock/ops and push. Nothing reaches firefly until you do."
          } >> "$GITHUB_STEP_SUMMARY"
